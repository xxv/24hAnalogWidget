name: Release

# Publishes a draft GitHub release with signed APKs (for sideloading) and Android App Bundles (for
# uploading to Google Play).
#
# Tag a release to run it, for example:
#
#   git tag wear-1.3.0 && git push github wear-1.3.0
#
# Signing uses the repository secrets below (Settings -> Secrets and variables -> Actions). See
# the README for how to create them.
#
# The current release key (a PKCS12 keystore, where the key password is the keystore password):
#
#   KEYSTORE_BASE64    the keystore, base64 encoded: base64 -w0 24h-analog.p12
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias within the keystore
#   KEY_PASSWORD       password for that key
#
# Without KEYSTORE_BASE64 the build still runs, but the artifacts are unsigned and can't be
# installed.
#
# How each artifact is signed:
#
#   bundles (.aab)   the current key, by Gradle. This is also the upload key for Google Play.
#   Sun app APK      the current key, by Gradle. It's a new app, so there's nothing to chain from.
#   watch face APK   the current key plus the lineage from the original key (signing/sign-apk.sh).
#   widget APK       as the watch face.
#
# The watch face and widget both need Android 13+ (see their minSdkVersion), which is also the
# version from which Android recognizes a rotated key, so the original key is never needed here.

on:
  push:
    tags:
      - 'v*'
      - 'wear-*'
      - 'sun-*'
      - 'widget-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Name for the release (defaults to the current ref)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check the signing lineage
        run: bash signing/sign-apk.sh check-lineage

      - name: Unit tests
        run: ./gradlew test

      - name: Decode the keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret; the release will be unsigned."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "path=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"

      # Gradle signs these with the current key.
      - name: Build the bundles and the Sun app
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease :sun:assembleRelease

      # Built without a key, so they can be signed with the lineage below.
      - name: Build the watch face and widget APKs
        run: ./gradlew :wear:assembleRelease :phoneWidget:assembleRelease

      - name: Sign the watch face and widget APKs
        if: steps.keystore.outputs.path != ''
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash signing/sign-apk.sh sign \
            wear/build/outputs/apk/release/wear-release-unsigned.apk signed/wear-release.apk
          bash signing/sign-apk.sh sign \
            phoneWidget/build/outputs/apk/release/phoneWidget-release-unsigned.apk signed/phoneWidget-release.apk

      - name: Collect the artifacts
        id: collect
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          mkdir -p artifacts

          # module:name pairs, so the files say what they are rather than "app-release.apk".
          # Each app has its own version, so name the files after that rather than the tag.
          for pair in "wear:24h-analog-watch-face" "sun:24h-analog-sun" "phoneWidget:24h-analog-widget"; do
            module="${pair%%:*}"
            name="${pair#*:}"
            version=$(sed -n 's/.*versionName *"\([^"]*\)".*/\1/p' "$module/build.gradle" | head -1)

            # The lineage-signed APK if there is one, otherwise what Gradle built.
            apk="signed/$module-release.apk"
            [ -e "$apk" ] || apk=$(ls "$module"/build/outputs/apk/release/*.apk | head -n 1)
            cp "$apk" "artifacts/$name-$version.apk"

            for aab in "$module"/build/outputs/bundle/release/*.aab; do
              [ -e "$aab" ] && cp "$aab" "artifacts/$name-$version.aab"
            done
          done

          ls -l artifacts

      - name: Verify the signatures
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"

          {
            echo "### APK signatures"
            echo
            echo "| File | Signer certificate (SHA-256) |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for apk in artifacts/*.apk; do
            if report="$("$apksigner" verify --print-certs "$apk" 2>&1)"; then
              digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$report")"
              echo "| $(basename "$apk") | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$(basename "$apk") is not signed; set the signing secrets to get installable builds."
              echo "| $(basename "$apk") | **not signed** |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.collect.outputs.tag }}" \
            --title "${{ steps.collect.outputs.tag }}" \
            --generate-notes \
            --draft \
            artifacts/*
          echo "Draft release created; review and publish it on the Releases page." >> "$GITHUB_STEP_SUMMARY"
