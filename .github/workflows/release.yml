name: Release

# Publishes a GitHub release with signed APKs (for sideloading) and Android App Bundles (for
# uploading to Google Play).
#
# Tag a release to run it, for example:
#
#   git tag wear-1.3.0 && git push github wear-1.3.0
#
# Signing needs these repository secrets (Settings -> Secrets and variables -> Actions):
#
#   KEYSTORE_BASE64    the keystore, base64 encoded: base64 -w0 my-release.keystore
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias within the keystore
#   KEY_PASSWORD       password for that key
#
# Without them the build still runs, but the artifacts are unsigned and can't be installed.

on:
  push:
    tags:
      - 'v*'
      - 'wear-*'
      - 'sun-*'
      - 'widget-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Name for the release (defaults to the current ref)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Unit tests
        run: ./gradlew test

      - name: Decode the keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret; the release will be unsigned." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Collect the artifacts
        id: collect
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          mkdir -p artifacts

          # module:name pairs, so the files say what they are rather than "app-release.apk".
          # Each app has its own version, so name the files after that rather than the tag.
          for pair in "wear:24h-analog-watch-face" "sun:24h-analog-sun" "phoneWidget:24h-analog-widget"; do
            module="${pair%%:*}"
            name="${pair#*:}"
            version=$(sed -n 's/.*versionName *"\([^"]*\)".*/\1/p' "$module/build.gradle" | head -1)
            for file in "$module"/build/outputs/apk/release/*.apk "$module"/build/outputs/bundle/release/*.aab; do
              [ -e "$file" ] || continue
              cp "$file" "artifacts/$name-$version.${file##*.}"
            done
          done

          ls -l artifacts

      - name: Check that the artifacts are signed
        run: |
          signed=true
          for apk in artifacts/*.apk; do
            case "$apk" in *unsigned*) signed=false ;; esac
          done
          if [ "$signed" = false ]; then
            echo "::warning::The APKs are unsigned; set the signing secrets to get installable builds."
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.collect.outputs.tag }}" \
            --title "${{ steps.collect.outputs.tag }}" \
            --generate-notes \
            --draft \
            artifacts/*
          echo "Draft release created; review and publish it on the Releases page." >> "$GITHUB_STEP_SUMMARY"
