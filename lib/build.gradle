apply plugin: 'com.android.library'

android {
    namespace 'info.staticfree.android.twentyfourhour.lib'
    compileSdkVersion 34

    defaultConfig {
        // Matches :phoneWidget, its only consumer. Also lets SunPositionOverlay use java.time
        // (TimeZone.toZoneId(), etc.) natively, without core library desugaring.
        minSdkVersion 33
        targetSdkVersion 33
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation project(':solar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
