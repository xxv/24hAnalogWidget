apply plugin: 'com.android.application'

android {
    namespace 'info.staticfree.android.twentyfourhour'
    compileSdkVersion 34

    defaultConfig {
        applicationId "info.staticfree.android.twentyfourhour"
        // Android 13+, matching :wear. Below that, sideloaded updates would need the original
        // signing key (see signing/sign-apk.sh) as well as this one.
        minSdkVersion 33
        targetSdkVersion 33
        versionCode 9
        versionName "0.5.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation project(':lib')
}

apply from: "$rootDir/gradle/signing.gradle"
