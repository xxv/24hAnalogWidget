apply plugin: 'com.android.application'

// Watch Face Format watch face: resources only, no code. The face is described by
// src/main/res/raw/watchface.xml. Sun times come from the :sun app's complications.
android {
    namespace 'info.staticfree.android.twentyfourhour.wear'
    compileSdkVersion 34

    defaultConfig {
        applicationId "info.staticfree.android.twentyfourhour.wear"
        // Watch Face Format v1 requires Wear OS 4 (API 33)
        minSdkVersion 33
        targetSdkVersion 34
        versionCode 501
        versionName "1.2.0"
    }
    buildTypes {
        release {
            // With no code to keep, R8 strips the generated R classes, so the release APK has
            // no classes.dex (Watch Face Format packages must be resource-only).
            minifyEnabled true
        }
    }
}

apply from: "$rootDir/gradle/signing.gradle"
